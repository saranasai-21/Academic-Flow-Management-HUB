<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle decoration -->
  <circle cx="256" cy="256" r="240" fill="url(#logo-grad)" opacity="0.08" />
  
  <!-- Main Graduation Cap icon -->
  <!-- Mortarboard Diamond -->
  <path d="M256 96 L464 200 L256 304 L48 200 Z" fill="url(#logo-grad)" filter="url(#glow)" />
  
  <!-- Cap Skull Cap Underneath -->
  <path d="M120 250 L120 340 C120 390, 392 390, 392 340 L392 250 L256 318 Z" fill="url(#logo-grad)" opacity="0.9" />
  
  <!-- Tassel Ribbon & Small Button -->
  <circle cx="256" cy="200" r="12" fill="#ffffff" />
  <path d="M256 200 Q340 240 364 300" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" />
  <rect x="356" y="296" width="16" height="36" rx="4" fill="#06b6d4" />
</svg>